[project]
name = "githubbuddy"
version = "0.2.0"
description = "Personal CLI for daily GitHub chores"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "PyGithub>=2.3",
]

[project.scripts]
gb = "gb.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gb"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
